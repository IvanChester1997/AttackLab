name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Tests and coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=90

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t attacklab:ci .

      - name: Build lab target image
        run: docker build -t attacklab-target:ci ./lab/target

      - name: Validate compose configuration
        run: docker compose config

  integration:
    name: E2E Integration
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Start AttackLab lab
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Run E2E tests
        run: pytest -q tests/e2e -m integration

      - name: Show service logs on failure
        if: failure()
        run: docker compose ps && docker compose logs

      - name: Stop lab
        if: always()
        run: docker compose down -v
